<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Change Password | Sarkari Update</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8fb;font:15px Arial,sans-serif;color:#212333}.card{width:calc(100% - 36px);max-width:430px;margin:30px 18px;background:white;padding:35px;border:1px solid #e9e9ef;border-radius:14px;box-shadow:0 10px 40px #25203008;line-height:1.7}.mark{background:#a51b40;color:white;display:inline-block;padding:7px 12px;border-radius:9px;font-weight:bold}.eyebrow{font-size:10px;letter-spacing:2px;color:#a51b40;margin:24px 0 8px;font-weight:bold}h1{font-size:27px;line-height:1.4;margin:0 0 10px}p{color:#737585;font-size:13px;margin:0 0 22px}label{display:block;font-size:12px;font-weight:bold;margin:17px 0 6px}input{width:100%;font:inherit;padding:12px;border:1px solid #dcdfe8;border-radius:7px}input:focus{outline:2px solid #a51b4033;border-color:#a51b40}.button{width:100%;border:0;font:inherit;padding:13px 18px;background:#a51b40;border-radius:7px;color:white;margin-top:24px;cursor:pointer;font-weight:bold}.button:disabled{opacity:.6}.back{display:block;margin-top:21px;text-align:center;color:#a51b40;font-size:12px}.status{font-size:12px;margin-top:15px;color:#a51b40}.subnote{font-size:11px;color:#90929f;line-height:1.7;margin:18px 0 0}.show{display:flex;gap:7px;align-items:center;font-size:11px;font-weight:normal;margin-top:10px}.show input{width:14px}.account{padding:10px 13px;border-radius:6px;background:#faf3f5;font-size:13px;margin:15px 0}.success{color:#278455}</style></head><body><main class="card"><span class="mark">SU</span><div class="eyebrow">ACCOUNT SETTINGS</div><h1>Change your password.</h1><p>Naya password save hone par purane password aur baaki admin sessions ka access band ho jayega.</p><form data-endpoint="/api/admin/password"><label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" data-secret autocomplete="current-password" required maxlength="128"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" data-secret autocomplete="new-password" required minlength="12" maxlength="128"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" data-secret autocomplete="new-password" required minlength="12" maxlength="128"><label class="show"><input id="show" type="checkbox"> Show passwords</label><button class="button">Save new password →</button><div class="status" id="status" role="status"></div></form><p class="subnote">Kam se kam 12 characters ka password rakhein. Isse source code ya browser storage mein save nahi kiya jayega.</p><a class="back" href="/admin">← Admin panel</a></main><script>document.querySelector('#show').onchange=e=>document.querySelectorAll('input[data-secret]').forEach(i=>i.type=e.target.checked?'text':'password');document.querySelector('form').onsubmit=async e=>{e.preventDefault();const form=e.target;const button=form.querySelector('button');button.disabled=true;const status=document.querySelector('#status');status.textContent='Please wait…';try{const response=await fetch(form.dataset.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed.');location.replace(data.redirect||'/admin')}catch(error){status.textContent=error.message;button.disabled=false}};</script></body></html>
